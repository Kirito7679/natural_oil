# Маршруты внутри naturaloilerp.uz. Наружу порт не публикуется:
# HTTPS даёт общий Caddy Evalon (infra/vds/caddy/naturaloil.caddy).
#
# Адрес backend'а подставляется через переменную и встроенный DNS Docker
# (127.0.0.11). Иначе nginx резолвит имя один раз при старте и падает,
# пока контейнер api ещё не поднялся — грабли Natural Print.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 16m;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# ── API ───────────────────────────────────────────────────────────
	location /api/ {
		set $api api;
		proxy_pass http://$api:8010$request_uri;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		# выгрузка отчётов в Excel на большом периоде считается не мгновенно
		proxy_read_timeout 90s;
	}

	# Swagger наружу не выставляем: он описывает весь API целиком.
	# Нужен — пробросить порт 8010 контейнера api через ssh-туннель.
	location ~ ^/(docs|redoc|openapi\.json)$ {
		return 404;
	}

	# ── статика ───────────────────────────────────────────────────────
	# имена файлов Vite содержат хеш — кешируем надолго
	location /assets/ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# шрифты и логотип из frontend/public/
	location ~* \.(woff2?|ttf|otf|eot)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
